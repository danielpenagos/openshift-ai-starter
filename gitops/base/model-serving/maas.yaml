apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: mistral-7b-instruct
  namespace: models-as-a-service
spec:
  modelRef:
    kind: LLMInferenceService
    name: mistral-7b-instruct
  tenantRef: models-as-a-service
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: mistral-7b-instruct-default
  namespace: models-as-a-service
spec:
  owner:
    groups:
      - name: "system:authenticated"
  modelRefs:
    - name: mistral-7b-instruct
      namespace: models-as-a-service
      tokenRateLimits:
        - limit: 100000
          window: 1h
      billingRate:
        perToken: "0"
  priority: 0
