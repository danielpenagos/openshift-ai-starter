apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - service-mesh
  # - nfd
  # - gpu-operator
  # - cert-manager
  # - openshift-ai
  # - authorino
  # - rhcl

patches:
  - target:
      kind: Subscription
      name: kiali-ossm
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "1"
  - target:
      kind: Subscription
      name: servicemeshoperator3
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "1"
  - target:
      kind: Subscription
      name: opentelemetry-product
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "1"
  - target:
      kind: Subscription
      name: tempo-product
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "3"
